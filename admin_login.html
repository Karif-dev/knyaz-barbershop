<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--surface:#0d0d0d;--surface-2:#141414;
  --text:#fff;--text-m:#888;--border:rgba(255,255,255,.12);
  --gold:#c9a227;--err:#e05;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px}
.logo{text-align:center;margin-bottom:32px}
.logo-k{font-family:'Oswald',sans-serif;font-size:36px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
.logo-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-m);margin-top:4px}
h1{font-size:18px;font-weight:500;margin-bottom:8px}
.sub{font-size:13px;color:var(--text-m);margin-bottom:28px}
label{display:block;font-size:12px;color:var(--text-m);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#000;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:20px;transition:opacity .2s}
.btn:hover{opacity:.88}
.err-msg{color:var(--err);font-size:13px;margin-top:12px;display:none;text-align:center}
.spinner{display:none;width:18px;height:18px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-k">КНЯЗЬ</div>
    <div class="logo-sub">Панель управления</div>
  </div>
  <h1>Войти</h1>
  <p class="sub">Введите пароль администратора</p>
  <div>
    <label>Пароль</label>
    <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn" onclick="login()" id="btn">Войти</button>
  <div class="err-msg" id="err">Неверный пароль</div>
  <div class="spinner" id="sp"></div>
</div>
<script>
async function login(){
  const pwd=document.getElementById('pwd').value.trim();
  if(!pwd)return;
  document.getElementById('btn').style.display='none';
  document.getElementById('sp').style.display='block';
  document.getElementById('err').style.display='none';
  try{
    const r=await fetch('/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    const d=await r.json();
    if(d.ok){window.location='/admin';}
    else{
      document.getElementById('err').style.display='block';
      document.getElementById('btn').style.display='block';
      document.getElementById('sp').style.display='none';
    }
  }catch(e){
    document.getElementById('btn').style.display='block';
    document.getElementById('sp').style.display='none';
  }
}
</script>
</body>
</html>
